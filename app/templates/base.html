<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>G3Video - {% block title %}Accueil{% endblock %}</title>
<style type="text/css">
body { font-family: "Chicago", sans-serif; background: #fff; color: #000; margin: 20px; }
a { color: #00f; }
input, button { font-size: 16px; }
.result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
.result .thumb { padding-right: 10px; vertical-align: top; }
.result .thumb img { border: 1px solid #999; }
.result .chanlogo { padding-right: 10px; vertical-align: top; }
.result .chanlogo img { border: 1px solid #999; }
.channel { margin: 10px 0; }
</style>
{% block head_extra %}{% endblock %}
</head>
<body>
<div id="header">
<h1><a href="/">G3Video</a></h1>
</div>
<div id="content">
{% block content %}{% endblock %}
</div>
</body>
</html>
